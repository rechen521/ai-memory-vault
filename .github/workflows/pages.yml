name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'scripts/build.mjs'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建单文件产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
